name: snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#1f6feb&color_dots=#ebedf0,#c6e2f7,#8cc4ee,#4ea3e0,#1f6feb
            dist/snake-dark.svg?palette=github-dark&color_snake=#74c7ec&color_dots=#1f1f22,#1f3a4d,#2d5f80,#4a8fb8,#74c7ec

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
